[project]
name = "personal-finance-analytics-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fizza-org", email = "fizza@betacodes.pk" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "typer>=0.27.0",
]

[project.scripts]
personal-finance-analytics-system = "personal_finance_analytics_system:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]
